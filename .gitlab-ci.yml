# Lint-only pipeline for the team GitLab repo.
# Runs on pushes to ios/main and macos/main, and on merge requests targeting them.

stages:
  - lint

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "ios/main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "macos/main")'
    - if: '$CI_COMMIT_BRANCH == "ios/main" || $CI_COMMIT_BRANCH == "macos/main"'

swiftlint:
  stage: lint

  image:
    name: ghcr.io/realm/swiftlint:0.65.1
    entrypoint: [""]
  script:
    - swiftlint version
    - swiftlint lint --strict
